<div class="main-banner main-banner-two">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-7 col-md-12">
                <div class="main-banner-content">
                    <div class="d-table">
                        <div class="d-table-cell">
                            <div class="content">
                                <h1>Solve business challenges with IT</h1>
                                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor dolore magna aliqua. Quis ipsum suspendisse ultrices gravida. Risus commodo viverra maecenas accumsan lacus vel facilisis.</p>
                                <a routerLink="/contact" class="default-btn">
                                    <i class="bx bxs-hot"></i> 
                                    Get Started 
                                    <span></span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5 col-md-12">
                <div class="banner-image-slider">
                    <owl-carousel-o [options]="bannerImagesSlides">
                        <ng-template carouselSlide>
                            <div class="banner-image2" style="background-image: url(img/banner-img1.jpg);"></div>
                        </ng-template>
                        <ng-template carouselSlide>
                            <div class="banner-image2" style="background-image: url(img/banner-img2.jpg);"></div>
                        </ng-template>
                        <ng-template carouselSlide>
                            <div class="banner-image2" style="background-image: url(img/banner-img3.jpg);"></div>
                        </ng-template>
                    </owl-carousel-o>
                </div>
            </div>
        </div>
    </div>
    <div class="shape20"><img src="img/shape/shape19.png" alt="image"></div>
    <div class="shape21"><img src="img/shape/shape20.png" alt="image"></div>
    <div class="shape19"><img src="img/shape/shape18.png" alt="image"></div>
    <div class="shape22"><img src="img/shape/shape21.png" alt="image"></div>
    <div class="shape23"><img src="img/shape/shape22.svg" alt="image"></div>
    <div class="shape24"><img src="img/shape/shape23.png" alt="image"></div>
    <div class="shape26"><img src="img/shape/shape25.png" alt="image"></div>
</div>
