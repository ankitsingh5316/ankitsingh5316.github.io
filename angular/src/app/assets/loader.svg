<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer circle -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#3498db" stroke-width="8" stroke-dasharray="502.65" stroke-dashoffset="502.65">
        <animate attributeName="stroke-dashoffset" values="502.65;0" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Phone icon -->
    <path d="M80 60h40v80H80z" fill="#3498db" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Call center text -->
    <text x="100" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#3498db">
        FreeCallCenter
    </text>
</svg> 