<section class="mv-area ptb-100 bg-f8fbfa">
  <div class="container">
    <div class="section-title">
      <h2>{{ aboutData?.missionVision?.heading }}</h2>
      <p>{{ aboutData?.missionVision?.subheading }}</p>
    </div>

    <div class="mv-grid">
      <div class="mv-card"
           *ngFor="let card of aboutData?.missionVision?.cards"
           [ngClass]="'mv-' + card.type">
        
        <div class="mv-icon">
          <i [class]="card.icon"></i>
        </div>
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
      </div>
    </div>
  </div>
</section>
