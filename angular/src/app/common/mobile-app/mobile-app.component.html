<!-- What We Do -->
<div class="features-area pt-100 pb-70 bg-f4f5fe">
  <div class="container">
    <div class="section-title">
      <h2>{{ aboutData?.whatWeDo?.heading }}</h2>
    </div>
    <div class="row">
      <div class="col-lg-3 col-sm-6" *ngFor="let service of aboutData?.whatWeDo?.services">
        <div class="single-features-box">
          <div class="icon">
            <i [class]="service.icon"></i>
          </div>
          <h3>{{ service.title }}</h3>
          <p>{{ service.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
